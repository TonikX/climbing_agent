events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream api_backend {
        zone api_backend 64k;
        server api:8000 resolve;
    }
    upstream bot_backend {
        zone bot_backend 64k;
        server bot:8000 resolve;
    }
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=6r/m;
    server {
        listen 80;
        return 308 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 128k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /telegram/webhook {
            proxy_pass http://bot_backend;
            proxy_read_timeout 20s;
        }
        location /api/v1/internal/ { return 404; }
        location /api/v1/tools/ { return 404; }
        location = /api/v1/auth/telegram/start {
            limit_req zone=login_rate burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://api_backend;
        }
        location = /api/v1/auth/telegram/callback {
            # Upstream errors otherwise include the authorization code in error_log.
            error_log /dev/stderr crit;
            limit_req zone=api_rate burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://api_backend;
        }
        location /api/ {
            limit_req zone=api_rate burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://api_backend;
        }
        root /usr/share/nginx/html;
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
